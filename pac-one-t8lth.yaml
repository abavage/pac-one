          name: flags
          type: string
        - default: v1.39
          description: golangci-lint version to use
          name: version
          type: string
        - default: linux
          description: running operating system target
          name: GOOS
          type: string
        - default: amd64
          description: running architecture target
          name: GOARCH
          type: string
        - default: auto
          description: value of module support
          name: GO111MODULE
          type: string
        spec: null
        steps:
        - computeResources: {}
